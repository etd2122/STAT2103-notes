<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Typed lecture notes, explained R code and homework guides for STAT UN2103 Applied Linear Regression, Fall 2026.">
<title>STAT 2103 Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: same RStudio-like split as the STAT 2102 guide. Sidebar of entries on the left; the source pane on the right
   stacks Files → typed notes or code boxes (code left, "what it does" + explanation right) → Remember for the test. */
:root{
  --paper:#f4f7fb; --panel:#ffffff; --ink:#152033; --muted:#5a6677; --line:#d9e0ea;
  --accent:#1f5fae; --accent-ink:#ffffff; --accent-soft:#e2ecf8; --mark:#f6dc5c; --mark-ink:#3a2f00; --mark-soft:#fdf6d3;
  --ok:#257a5c; --ok-soft:#e3f2ec; --warn:#a5610f; --warn-soft:#fbefdf;
  --code-bg:#eef2f8;
  --t-lec:#55617a; --t-rex:#257a5c; --t-hw:#1f5fae;
  --hl-kw:#8a2f9e; --hl-str:#2b7a2b; --hl-num:#b3541e; --hl-com:#7a8496; --hl-fn:#1f5fae;
  color-scheme:light;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}

/* Sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit}
.brand .code{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.04em}
.brand h1{font-family:var(--display);font-size:22px;line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
.brand .sub{color:var(--muted);font-size:13px}
.side-actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.side-actions .btn{flex:1}
.menu-btn{display:none}
.search{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.group-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:12px 8px 4px}
.item{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;border-radius:6px;padding:7px 8px;cursor:pointer;text-decoration:none;color:inherit}
.item:hover{background:var(--code-bg)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item .tag{font-family:var(--mono);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.item .t{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta{grid-column:2;font-size:12px;color:var(--muted)}
.tc-lec{color:var(--t-lec)}.tc-rex{color:var(--t-rex)}.tc-hw{color:var(--t-hw)}.tc-prac{color:var(--warn)}
.side-body{display:flex;flex-direction:column;gap:12px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted)}
.empty-line{color:var(--muted);font-size:14px;font-style:italic;padding:8px}

/* Main */
.main{padding-block:28px 72px;padding-inline:40px;min-width:0}
.wrap{max-width:940px;display:flex;flex-direction:column;gap:28px}
.head{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.02em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow .date{color:var(--muted);font-weight:400}
.head h2{font-family:var(--display);font-size:34px;line-height:1.1;margin:0;font-weight:700;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:70ch}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;border-radius:4px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.badge.part{background:var(--mark);border-color:var(--mark);color:var(--mark-ink);font-weight:600}
section.block{display:flex;flex-direction:column;gap:12px}
.block-h{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:6px;flex-wrap:wrap}
.block-h h3{font-family:var(--display);font-size:18px;margin:0;font-weight:600}
.block-h .count{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:8px;font-weight:400}

/* Files */
.files{display:flex;flex-wrap:wrap;gap:10px}
.file{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 12px 8px 8px;text-decoration:none;color:var(--ink);min-width:0}
.file:hover{border-color:var(--accent)}
.file img{width:44px;aspect-ratio:425/550;object-fit:cover;border:1px solid var(--line);border-radius:3px;background:#fff}
.file .ic{font-family:var(--mono);font-size:11px;font-weight:600;border:1px solid currentColor;border-radius:3px;padding:1px 5px}
.file .ic.pdf{color:#b3261e}.file .ic.r{color:var(--t-rex)}.file .ic.html{color:var(--accent)}
.file .nm{font-weight:500;font-size:14px}
.file .sz{font-size:12px;color:var(--muted)}
.related{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.rel{font-size:13px;border-radius:999px;padding:3px 10px;text-decoration:none;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.rel:hover{border-color:var(--accent)}
.rel b{font-family:var(--mono);font-size:12px;margin-right:4px}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px dashed var(--line)}
.toc a:hover{color:var(--accent)}

/* Typed notes */
.prose{max-width:74ch;font-size:15.5px}
.prose h2{font-family:var(--display);font-size:22px;margin:30px 0 8px;scroll-margin-top:16px}
.prose h2:first-child{margin-top:0}
.prose h3{font-family:var(--display);font-size:17px;margin:20px 0 6px}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 12px}
.prose li{margin:3px 0}
.prose code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:3px}
.prose blockquote{margin:0 0 12px;padding:8px 14px;border-left:3px solid var(--line);color:var(--muted)}
.prose table{border-collapse:collapse;font-size:14px;margin:0 0 14px;display:block;overflow-x:auto;max-width:100%}
.prose th,.prose td{border:1px solid var(--line);padding:5px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--code-bg);font-weight:600}
.box{border:1px solid var(--line);border-radius:8px;padding:12px 16px 2px;margin:0 0 16px;background:var(--panel)}
.box-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.box-k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.box-t{font-family:var(--display);font-weight:600;font-size:16px}
.box-def{border-color:var(--accent);background:var(--accent-soft)}.box-def .box-k{color:var(--accent)}
.box-formula{border-color:var(--mark);background:var(--mark-soft)}.box-formula .box-k{color:var(--mark-ink)}
.box-example{border-color:var(--ok);background:var(--ok-soft)}.box-example .box-k{color:var(--ok)}
.box-tip{border-color:var(--warn);background:var(--warn-soft)}.box-tip .box-k{color:var(--warn)}
.box-template{border-color:var(--t-rex);border-left-width:4px}.box-template .box-k{color:var(--t-rex)}
.tpl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.tpl > *,.fgrid > *{min-width:0}
.box{overflow-x:auto}
.tpl h2{grid-column:1/-1}
.tpl > p{grid-column:1/-1}
.box-r{background:var(--code-bg)}.box-r .box-k{color:var(--t-rex)}
.box table{background:var(--panel)}
math{font-size:1.06em}
math[display="block"]{display:block;overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:6px 0 12px}
.katex{white-space:normal}

/* Code chunks */
.sec-h{font-family:var(--display);font-size:20px;margin:6px 0 0;font-weight:600}
.chunks{display:flex;flex-direction:column;gap:14px}
.chunk{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;scroll-margin-top:16px}
.chunk.key{border-color:var(--mark);box-shadow:inset 3px 0 0 var(--mark)}
.chunk.solo{grid-template-columns:minmax(0,1fr)}
.chunk-code{min-width:0;display:flex;flex-direction:column}
.chunk-bar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
.chunk-bar .num{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chunk-bar .lbl{font-family:var(--mono);font-weight:600;flex:1;min-width:0}
.star{font-size:11px;font-weight:600;background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:1px 6px}
.copy{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px}
.copy:hover{color:var(--accent)}
pre{margin:0;overflow-x:auto;background:var(--code-bg);padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.6;flex:1}
pre code{font-family:inherit;background:none}
.plots{display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:var(--code-bg);border-top:1px dashed var(--line)}
.plots a{display:block;flex:1 1 240px;max-width:380px}
.plots img{display:block;width:100%;border-radius:4px;background:#fff;border:1px solid var(--line)}
.chunk-side{border-left:1px dashed var(--line);min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.chunk.solo .chunk-side{border-left:0}
.chunk-q{padding:10px 14px;font-size:14px;background:var(--accent-soft);border-bottom:1px dashed var(--line);overflow-wrap:anywhere}
.chunk-note{padding:10px 14px 6px;font-size:14px}
.chunk-note ul{margin:0;padding-left:18px}
.chunk-note li{margin:0 0 6px}
.label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:4px}
.chunk-q .label{color:var(--accent)}
.chunk-q code,.chunk-note code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:0 4px;border-radius:3px}
.concept{grid-column:1/-1;border-top:1px solid var(--line);padding:14px 16px 6px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 24px;background:var(--panel)}
.concept .idea{grid-column:1/-1;background:var(--ok-soft);border-left:3px solid var(--ok);border-radius:4px;padding:10px 14px;margin-bottom:8px}
.concept .idea .label{color:var(--ok)}
.concept .idea p{margin:0;font-size:15px}
.concept .walk,.concept .pit{font-size:14px;min-width:0}
.concept ol,.concept ul{margin:0 0 8px;padding-left:20px}
.concept li{margin:0 0 7px}
.concept .pit .label{color:var(--warn)}
.concept code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:0 4px;border-radius:3px}
.chunk.flash{outline:3px solid var(--mark);outline-offset:2px}
.hljs-keyword,.hljs-built_in,.hljs-literal{color:var(--hl-kw)}
.hljs-string{color:var(--hl-str)}
.hljs-number{color:var(--hl-num)}
.hljs-comment{color:var(--hl-com);font-style:italic}
.hljs-title,.hljs-title.function_{color:var(--hl-fn)}
.hljs-operator,.hljs-punctuation{color:var(--ink)}

/* Takeaways */
.takeaways{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;counter-reset:tk}
.takeaways li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;counter-increment:tk}
.takeaways li::before{content:counter(tk);font-family:var(--mono);font-size:12px;font-weight:600;color:var(--mark-ink);background:var(--mark);border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.takeaways code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:0 4px;border-radius:3px}

/* Guide & formulas */
.guide-stats{display:flex;gap:28px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.g-entry{display:flex;flex-direction:column;gap:10px;padding-top:18px;border-top:1px solid var(--line)}
.g-entry h4{margin:0;font-family:var(--display);font-size:19px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.g-entry h4 a{color:inherit;text-decoration:none}
.g-entry h4 a:hover{color:var(--accent)}
.g-entry h4 .tag{font-family:var(--mono);font-size:13px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .box{margin:0}
.fgrid .box .src{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .side.collapsed .collapsible{display:none}
  .menu-btn{display:inline-flex}
  .main{padding-inline:16px}
  .head h2{font-size:27px}
  .chunk{grid-template-columns:minmax(0,1fr)}
  .chunk-side{border-left:0;border-top:1px dashed var(--line)}
  .concept{grid-template-columns:minmax(0,1fr)}
  .fgrid,.tpl{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#guide">
      <span class="code">STAT 2103 · Fall 2026</span>
      <h1>Applied Linear Regression</h1>
      <span class="sub">Typed notes, explained R code and homework guides</span>
    </a>
    <div class="side-actions">
      <a class="btn" id="btnGuide" href="#guide" aria-pressed="false">Study guide</a>
      <a class="btn" id="btnFormulas" href="#formulas" aria-pressed="false">Formula sheet</a>
      <button class="btn menu-btn" id="btnMenu" type="button" aria-expanded="false">List</button>
    </div>
    <div class="collapsible side-body">
      <input class="search" id="search" type="search" placeholder="Search notes, code, explanations…" aria-label="Search">
      <div class="chips" id="typeChips" role="group" aria-label="Filter by type"></div>
      <div class="chips" id="partChips" role="group" aria-label="Filter by part"></div>
      <ul class="list" id="list"></ul>
    </div>
    <div class="side-foot collapsible">Source files: edit <code>content/</code>, then run <code>build/build.py</code>.</div>
  </aside>
  <main class="main" id="main"><div class="wrap"><p class="lede">Loading…</p></div></main>
</div>

<script src="data/site.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const S = window.SITE || {notes:[],examples:[],homework:[],formulas:[]};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip = h => String(h || '').replace(/<annotation[^>]*>.*?<\/annotation>/g,'').replace(/<[^>]+>/g,' ');
const TYPES = {lec:{label:'Lecture notes', short:'Notes'}, rex:{label:'R examples', short:'R code'}, hw:{label:'Homework', short:'Homework'}, prac:{label:'Practice exams', short:'Practice'}};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = d => { const [y,m,dd] = d.split('-'); return `${MONTHS[+m-1]} ${+dd}`; };

// index everything by id
const BY = {};
S.notes.forEach(e => BY[e.id] = e);
S.examples.forEach(e => BY[e.id] = e);
S.homework.forEach(e => BY[e.id] = e);
(S.practice||[]).forEach(e => BY[e.id] = e);
const partOf = e => e.type === 'lec' ? e.part : e.type === 'rex' ? (BY[e.lecture]?.part || '') :
  ((e.lectures || []).map(l => BY[l]?.part).includes('Part II') ? 'Part II' : 'Part I');
const ALL = [...S.notes, ...S.examples, ...S.homework, ...(S.practice||[])];
ALL.forEach(e => {
  e._part = partOf(e);
  const boxes = (e.sections || []).flatMap(s => s.boxes);
  e._hay = [e.id, e.title, (e.topics||[]).join(' '), strip(e.summary), strip(e.html), (e.takeaways||[]).map(strip).join(' '),
    ...boxes.map(b => strip(b.title) + ' ' + strip(b.what) + ' ' + strip(b.question) + ' ' + (b.code||'') + ' ' + (b.explain||[]).map(strip).join(' '))].join(' ').toLowerCase();
});
const hwFor = lecId => S.homework.filter(h => (h.lectures||[]).includes(lecId));
const exFor = lecId => S.examples.filter(x => x.lecture === lecId || (BY[lecId]?.examples||[]).includes(x.id));

let filterType = 'all', filterPart = 'all', query = '';
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function recall(k){try{return localStorage.getItem(k)}catch(e){return null}}

// ---------- sidebar
function renderChips(){
  $('#typeChips').innerHTML = [['all','All'],['lec','Notes'],['rex','R code'],['hw','Homework'],['prac','Practice']]
    .map(([v,l]) => `<button class="chip" type="button" data-type="${v}" aria-pressed="${filterType===v}">${l}</button>`).join('');
  $('#partChips').innerHTML = [['all','Any part'],['Part I','Part I · Review'],['Part II','Part II · Regression']]
    .map(([v,l]) => `<button class="chip" type="button" data-part="${v}" aria-pressed="${filterPart===v}">${l}</button>`).join('');
}
function matches(e){
  if (filterType !== 'all' && e.type !== filterType) return false;
  if (filterPart !== 'all' && e._part !== filterPart) return false;
  if (query) return query.split(/\s+/).every(w => e._hay.includes(w));
  return true;
}
function metaOf(e){
  if (e.type === 'lec') return `${fmtDate(e.date)} · ${e.toc.length} sections`;
  const n = e.sections.reduce((a,s) => a + s.boxes.length, 0);
  if (e.type === 'rex') return `${n} boxes · goes with ${e.lecture}`;
  return `${n} problems`;
}
function renderList(){
  const cur = location.hash.slice(1).split('-b')[0];
  const items = ALL.filter(matches);
  if (!items.length){ $('#list').innerHTML = '<li class="empty-line">Nothing matches.</li>'; return; }
  let html = '', last = '';
  for (const e of items){
    if (e.type !== last){ html += `<li class="group-h">${TYPES[e.type].label}</li>`; last = e.type; }
    html += `<li><a class="item" href="#${e.id}" aria-current="${cur===e.id}">
      <span class="tag tc-${e.type}">${e.id}</span><span class="t">${esc(e.title)}</span>
      <span class="meta">${esc(metaOf(e))}</span></a></li>`;
  }
  $('#list').innerHTML = html;
}
function renderSide(){
  renderChips(); renderList();
  const h = location.hash.slice(1) || 'guide';
  $('#btnGuide').setAttribute('aria-pressed', h === 'guide');
  $('#btnFormulas').setAttribute('aria-pressed', h === 'formulas');
}

// ---------- pieces
const fileCard = (href, ic, name, sz, thumb) =>
  `<a class="file" href="${esc(href)}" target="_blank" rel="noopener">${thumb ? `<img src="${esc(thumb)}" alt="" loading="lazy">` : ''}
   <span><span class="ic ${ic}">${ic.toUpperCase()}</span></span><span style="display:flex;flex-direction:column;min-width:0"><span class="nm">${esc(name)}</span>${sz ? `<span class="sz">${esc(sz)}</span>` : ''}</span></a>`;
const relLink = e => `<a class="rel" href="#${e.id}"><b class="tc-${e.type}">${e.id}</b>${esc(e.title)}</a>`;
const takeawaysHTML = tk => tk && tk.length ? `<section class="block"><div class="block-h"><h3>Remember for the test<span class="count">${tk.length}</span></h3></div><ol class="takeaways">${tk.map(t => `<li><span>${t}</span></li>`).join('')}</ol></section>` : '';
function headHTML(e, kind, extra){
  return `<header class="head">
    <div class="eyebrow"><span class="tc-${e.type}">${e.id} · ${kind}</span>${extra ? `<span class="date">${extra}</span>` : ''}</div>
    <h2>${esc(e.title)}</h2>
    <p class="lede">${e.summary || ''}</p>
    <div class="badges">${e._part ? `<span class="badge part">${esc(e._part)}</span>` : ''}${(e.topics||[]).map(t => `<span class="badge">${esc(t)}</span>`).join('')}</div>
  </header>`;
}
function conceptHTML(b){
  if (!b.idea && !(b.walk||[]).length && !(b.pitfall||[]).length) return '';
  return `<div class="concept">
    ${b.idea ? `<div class="idea"><span class="label">The big idea</span><p>${b.idea}</p></div>` : ''}
    ${(b.walk||[]).length ? `<div class="walk"><span class="label">Think it through, step by step</span><ol>${b.walk.map(x => `<li>${x}</li>`).join('')}</ol></div>` : ''}
    ${(b.pitfall||[]).length ? `<div class="pit"><span class="label">Common mistakes</span><ul>${b.pitfall.map(x => `<li>${x}</li>`).join('')}</ul></div>` : ''}
  </div>`;
}
function chunkHTML(e, b, isHW){
  const anchor = `${e.id}-b${b.n}`;
  const hasCode = !!(b.code && b.code.trim());
  const side = `<div class="chunk-side">
      <div class="chunk-q"><span class="label">${isHW ? 'Question' : 'What this does'}</span>${isHW ? b.question : b.what}</div>
      <div class="chunk-note"><span class="label">${isHW ? (e.type === 'prac' ? 'Answer and why' : 'How to approach it') : 'Explanation'}</span><ul>${(b.explain||[]).map(x => `<li>${x}</li>`).join('')}</ul></div>
    </div>`;
  if (!hasCode) return `<article class="chunk solo${b.key ? ' key' : ''}" id="${anchor}">
      <div class="chunk-bar"><span class="num">${String(b.n).padStart(2,'0')}</span><span class="lbl">${b.title}</span>${b.key ? '<span class="star">Exam</span>' : ''}</div>${side}${conceptHTML(b)}</article>`;
  return `<article class="chunk${b.key ? ' key' : ''}" id="${anchor}">
    <div class="chunk-code">
      <div class="chunk-bar"><span class="num">${String(b.n).padStart(2,'0')}</span><span class="lbl">${b.title}</span>${b.key ? '<span class="star">Exam</span>' : ''}<button class="copy" type="button" data-copy="${anchor}">Copy</button></div>
      <pre><code class="language-r">${esc(b.code)}</code></pre>
      ${b.imgs && b.imgs.length ? `<div class="plots">${b.imgs.map(src => `<a href="${esc(src)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="Plot produced by this code" loading="lazy"></a>`).join('')}</div>` : ''}
    </div>${side}${conceptHTML(b)}</article>`;
}
function sectionsHTML(e, isHW){
  const n = e.sections.reduce((a,s) => a + s.boxes.length, 0);
  return `<section class="block"><div class="block-h"><h3>${isHW ? 'Problems' : 'Code'}<span class="count">${n} ${isHW ? 'problems' : 'boxes'}</span></h3>
    <span class="related">Yellow edge = <span class="star">Exam</span> likely to matter on a test</span></div>
    ${e.sections.map(s => `${s.title ? `<h4 class="sec-h">${esc(s.title)}</h4>` : ''}<div class="chunks">${s.boxes.map(b => chunkHTML(e, b, isHW)).join('')}</div>`).join('')}
  </section>`;
}

// ---------- views
function lectureHTML(e){
  const pages = {L01:13,L02:14,L03:10,L04:12,L05:12,L06:10,L07:11,L08:10,L09:12,L10:13,L11:12}[e.id];
  const ex = exFor(e.id), hw = hwFor(e.id);
  return headHTML(e, 'Lecture notes', fmtDate(e.date)) +
  `<section class="block"><div class="block-h"><h3>Files</h3></div>
     <div class="files">${fileCard(e.pdf, 'pdf', 'Handwritten notes', pages ? pages + ' pages' : '', e.thumb)}${e.slides ? fileCard(e.slides, 'pdf', 'Lecture slides', 'from class') : ''}</div>
     ${ex.length || hw.length ? `<div class="related">Goes with ${[...ex, ...hw].map(relLink).join('')}</div>` : ''}
   </section>
   <section class="block"><div class="block-h"><h3>Typed notes<span class="count">${e.toc.length} sections</span></h3></div>
     <nav class="toc" aria-label="Sections">${e.toc.map(t => `<a href="#${t.id}" data-scroll="${t.id}">${t.t}</a>`).join('')}</nav>
     <div class="prose">${e.html}</div>
   </section>` + takeawaysHTML(e.takeaways);
}
function exampleHTML(e){
  const lec = BY[e.lecture];
  return headHTML(e, 'R example', lec ? `goes with ${lec.id} · ${fmtDate(lec.date)}` : '') +
  `<section class="block"><div class="block-h"><h3>Files</h3></div>
     <div class="files">${fileCard(e.notebook, 'html', 'Original notebook', 'code, output and plots')}${fileCard(e.script, 'r', e.key + '.R', 'runnable script')}</div>
     ${lec ? `<div class="related">Notes: ${relLink(lec)}</div>` : ''}
   </section>` + sectionsHTML(e, false) + takeawaysHTML(e.takeaways);
}
function homeworkHTML(e){
  const lecs = (e.lectures||[]).map(l => BY[l]).filter(Boolean);
  const exs = [...new Set(lecs.flatMap(l => exFor(l.id)))];
  const prac = e.type === 'prac';
  return headHTML(e, prac ? 'Practice exam' : 'Homework') +
  `<section class="block"><div class="block-h"><h3>Files</h3></div>
     <div class="files">${fileCard(e.pdf, 'pdf', prac ? `Exam ${e.num} practice questions` : `Homework ${e.num}`, prac ? 'questions + tables' : 'assignment', e.thumb)}${e.solutions ? fileCard(e.solutions, 'pdf', 'Official solutions', 'from the instructor') : ''}</div>
     ${prac ? '' : `<div class="related">Data: ${(e.data||[]).map(d => (S.datasets||[]).includes(d)
        ? `<a class="rel" href="datasets/${esc(d)}" download><b class="tc-hw">CSV</b>${esc(d)}</a>`
        : `<span class="rel" title="Not uploaded yet"><b>CSV</b>${esc(d)} · not uploaded</span>`).join('') || 'none'}</div>`}
     <div class="related">${prac ? 'Covers' : 'Use'} ${[...lecs, ...exs].map(relLink).join('')}</div>
   </section>` + sectionsHTML(e, true);
}
function guideHTML(){
  const nBoxes = S.examples.reduce((a,e) => a + e.sections.reduce((b,s) => b + s.boxes.length, 0), 0);
  const nTk = ALL.reduce((a,e) => a + (e.takeaways||[]).length, 0);
  return `<header class="head"><div class="eyebrow"><span class="tc-lec">Columbia · STAT UN2103 · Fall 2026</span></div>
    <h2>Study guide</h2>
    <p class="lede">Every "Remember for the test" point from the typed notes and R examples, in course order. Click a title to open the full entry.</p>
    <div class="guide-stats">
      <div class="stat"><b>${S.notes.length}</b><span>lectures typed up</span></div>
      <div class="stat"><b>${nBoxes}</b><span>explained R boxes</span></div>
      <div class="stat"><b>${S.homework.length}</b><span>homework guides</span></div>
      <div class="stat"><b>${S.formulas.length}</b><span>formulas</span></div>
      <div class="stat"><b>${nTk}</b><span>key points</span></div>
    </div></header>` +
  S.notes.map(l => {
    const ex = exFor(l.id);
    return `<div class="g-entry"><h4><a href="#${l.id}"><span class="tag tc-lec">${l.id}</span> ${esc(l.title)}</a><span class="badge">${fmtDate(l.date)}</span></h4>
      <ol class="takeaways">${l.takeaways.map(t => `<li><span>${t}</span></li>`).join('')}</ol>
      ${ex.map(x => `<h4 style="font-size:16px"><a href="#${x.id}"><span class="tag tc-rex">${x.id}</span> ${esc(x.title)}</a></h4><ol class="takeaways">${x.takeaways.map(t => `<li><span>${t}</span></li>`).join('')}</ol>`).join('')}
    </div>`;
  }).join('');
}
function formulasHTML(){
  const T = S.templates;
  const tpl = T ? `<section class="block" id="templates"><div class="block-h"><h3>Interpretation templates<span class="count">fill in the brackets</span></h3></div>
      <nav class="toc" aria-label="Template sections">${T.toc.map(t => `<a href="#formulas" data-jump="${t.id}">${t.t}</a>`).join('')}</nav>
      <div class="prose tpl" style="max-width:none">${T.html}</div></section>` : '';
  return `<header class="head"><div class="eyebrow"><span class="tc-lec">All lectures</span></div><h2>Formula sheet</h2>
    <p class="lede">Fill-in-the-blank interpretation templates first, then every formula box from the typed notes, grouped by lecture.</p>
    <div class="toc"><a href="#formulas" data-jump="templates">Interpretation templates</a><a href="#formulas" data-jump="formulas-list">Formulas by lecture</a></div></header>` + tpl +
  `<div id="formulas-list"></div>` +
  S.notes.map(l => {
    const fs = S.formulas.filter(f => f.lec === l.id);
    if (!fs.length) return '';
    return `<section class="block"><div class="block-h"><h3><a href="#${l.id}" style="color:inherit;text-decoration:none">${l.id} · ${esc(l.title)}</a><span class="count">${fs.length}</span></h3></div>
      <div class="fgrid prose" style="max-width:none">${fs.map(f => `<div class="box box-formula"><div class="box-h"><span class="box-t">${f.title || 'Formula'}</span></div>${f.html}</div>`).join('')}</div></section>`;
  }).join('');
}
function render(){
  const raw = location.hash.slice(1);
  let id = raw || 'guide', target = null;
  if (/^(L|R|HW|PE)\d+-b\d+$/.test(raw)){ id = raw.split('-b')[0]; target = raw; }
  else if (/^L\d+-/.test(raw)){ id = raw.slice(0,3); target = raw; }
  let html;
  const e = BY[id];
  if (id === 'formulas') html = formulasHTML();
  else if (e && e.type === 'lec') html = lectureHTML(e);
  else if (e && e.type === 'rex') html = exampleHTML(e);
  else if (e && (e.type === 'hw' || e.type === 'prac')) html = homeworkHTML(e);
  else html = guideHTML();
  const main = $('#main');
  main.innerHTML = `<div class="wrap">${html}</div>`;
  if (window.hljs) main.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
  renderSide();
  if (target){ const t = document.getElementById(target); if (t){ t.scrollIntoView({block:'start'}); if (t.classList.contains('chunk')){ t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1400); } } }
  else window.scrollTo(0,0);
  if (window.innerWidth <= 860) setMenu(false);
}

// ---------- events
function setMenu(open){ $('#side').classList.toggle('collapsed', !open); $('#btnMenu').setAttribute('aria-expanded', open); $('#btnMenu').textContent = open ? 'Hide list' : 'List'; }
$('#btnMenu').addEventListener('click', () => setMenu($('#side').classList.contains('collapsed')));
$('#typeChips').addEventListener('click', ev => { const b = ev.target.closest('[data-type]'); if (!b) return; filterType = b.dataset.type; store('s2103.type', filterType); renderSide(); });
$('#partChips').addEventListener('click', ev => { const b = ev.target.closest('[data-part]'); if (!b) return; filterPart = b.dataset.part; store('s2103.part', filterPart); renderSide(); });
$('#search').addEventListener('input', ev => { query = ev.target.value.trim().toLowerCase(); renderList(); });
document.addEventListener('click', async ev => {
  const c = ev.target.closest('[data-copy]');
  if (!c) return;
  const code = document.getElementById(c.dataset.copy).querySelector('pre code');
  const text = code.textContent.split('\n').filter(l => !l.startsWith('#>')).join('\n').trim();
  try { await navigator.clipboard.writeText(text); c.textContent = 'Copied'; }
  catch(_) { const r = document.createRange(); r.selectNodeContents(code); const s = getSelection(); s.removeAllRanges(); s.addRange(r); c.textContent = 'Selected'; }
  setTimeout(() => c.textContent = 'Copy', 1500);
});
document.addEventListener('click', ev => { const j = ev.target.closest('[data-jump]'); if (!j) return; ev.preventDefault(); const t = document.getElementById(j.dataset.jump); if (t) t.scrollIntoView({block:'start'}); });
window.addEventListener('hashchange', render);
filterType = recall('s2103.type') || 'all'; filterPart = recall('s2103.part') || 'all';
if (window.innerWidth <= 860) setMenu(false);
render();
</script>
</body>
</html>
